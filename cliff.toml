# git-cliff configuration (https://git-cliff.org).
# Produces Keep a Changelog drafts to stdout via `make changelog-draft`;
# it never writes CHANGELOG.md itself, the /changelog skill does.

[changelog]
header = """
# Changelog

All notable changes to Databasement are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project adheres to
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Releases before 1.0.0 are only listed on
[GitHub Releases](https://github.com/David-Crty/databasement/releases).

"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}

"""

footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/David-Crty/databasement/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/David-Crty/databasement/releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [Unreleased]: https://github.com/David-Crty/databasement/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"

# GitHub appends "(#123)" to squash-merge subjects; turn it into a PR link.
commit_preprocessors = [
    { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/David-Crty/databasement/pull/${1}))" },
]

# First match wins. Group names carry a hidden ordering prefix so the
# template renders sections in Keep a Changelog order; it is stripped on output.
commit_parsers = [
    # Noise that never reaches the changelog
    { message = "^(chore|build)\\(deps(-dev)?\\)", skip = true },
    { message = "^(ci|test|style|docs|chore)(\\(.*\\))?!?:", skip = true },
    { message = "^Merge ", skip = true },

    # Conventional commits (the convention for PR titles)
    { message = "^fix\\((security|deps)\\)", group = "<!-- 5 -->Security" },
    { message = "^[a-z]+(\\(.*\\))?!?: (?i)(remove|drop) ", group = "<!-- 3 -->Removed" },
    { message = "^[a-z]+(\\(.*\\))?!?: (?i)deprecate", group = "<!-- 2 -->Deprecated" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },

    # Plain-sentence subjects (history between Aug and Sep 2026)
    { message = "(?i)(CVE-|harden|mask the|^reject |^restrict |scope .* organization|front controller)", group = "<!-- 5 -->Security" },
    { message = "(?i)^(add|allow|support|ship|introduce|expose|let) ", group = "<!-- 0 -->Added" },
    { message = "(?i)^(remove|drop) ", group = "<!-- 3 -->Removed" },
    { message = "(?i)^(fix|stop|prevent|finalize|resolve|apply|match|validate|fail|keep|point) ", group = "<!-- 4 -->Fixed" },
    { message = ".*", group = "<!-- 1 -->Changed" },
]
